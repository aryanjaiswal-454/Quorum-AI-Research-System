[project]
name = "multi-agent-ai-research-system"
version = "0.1.0"
description = "Multi-agent AI research system using Tavily, BeautifulSoup, and OpenAI"
readme = "README.md"
authors = [
    { name = "Aryan Jaiswal", email = "45aryanjaiswal45@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "html5lib>=1.1",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=0.1.0",
    "lxml>=5.0.0",
    "openai>=1.30.0",
    "orjson>=3.9.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "streamlit>=1.67.0",
    "tavily-python>=0.3.0",
    "tenacity>=8.2.0",
    "tiktoken>=0.12.0",
]

[tool.uv]
package = false
